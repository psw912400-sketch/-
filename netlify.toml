[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"

# 광고 노출시간(평일 09~12시, 13~18시 한국시간)에만 실행합니다. 크레딧 절약: 월 약 44회.
# 한국시간 12시·18시 = UTC 3시·9시 (평일). 각 실행이 직전 6시간 로그를 읽고 그 안의 모든 3시간 구간을 검사하므로 노출시간 전체가 빠짐없이 검사됩니다.
[functions."check-abuse"]
  schedule = "0 3,9 * * 1-5"
